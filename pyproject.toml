[project]
name = "pawnlink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tkgalon", email = "z41d123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "google-auth>=2.61.0",
    "lightgbm>=4.7.0",
    "requests>=2.34.2",
    "tldextract>=5.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pawnlink = "pawnlink:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
monitor = [
    "evidently>=0.7.23",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-storage>=3.17.1",
]
train = [
    "mlflow>=3.17.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[tool.uv]
# Local dev needs the training and monitoring stacks too; the API image installs none of them.
default-groups = ["dev", "train", "monitor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
