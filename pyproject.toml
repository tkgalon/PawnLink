[project]
name = "pawnlink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tkgalon", email = "z41d123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "tldextract>=5.4.0",
]

[project.scripts]
pawnlink = "pawnlink:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
train = [
    "mlflow>=3.17.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]
