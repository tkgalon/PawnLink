<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 6 160 280">
  <style>
    .body { animation: bob 3.2s ease-in-out infinite; }
    .shadow { animation: shadow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .eyes { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    .wave { animation: wave 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle { animation: sparkle 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 0.12; } 50% { transform: scaleX(0.88); opacity: 0.08; } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
    @keyframes wave {
      0%, 68%, 100% { transform: translate(0, 0) rotate(0deg); }
      74%, 84% { transform: translate(24px, -58px) rotate(30deg); }
      79%, 89% { transform: translate(24px, -58px) rotate(-5deg); }
      95% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes sparkle { 0%, 36%, 54%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } }
    @media (prefers-reduced-motion: reduce) {
      .body, .shadow, .eyes, .wave, .sparkle { animation: none; }
    }
  </style>
  <ellipse class="shadow" cx="120" cy="276" rx="68" ry="7" fill="#2B2350" opacity="0.12"/>
  <g class="body">
    <rect x="50" y="236" width="140" height="34" rx="17" fill="#4E8FD9"/>
    <rect x="50" y="234" width="140" height="26" rx="13" fill="#7CB5F8"/>
    <path d="M90 150 C94 190 82 220 66 240 L174 240 C158 220 146 190 150 150 Z" fill="#7CB5F8"/>
    <path d="M140 150 C144 190 150 220 164 240 L174 240 C158 220 146 190 150 150 Z" fill="#5E9CE8"/>
    <rect x="74" y="140" width="92" height="20" rx="10" fill="#4E8FD9"/>
    <circle cx="120" cy="86" r="58" fill="#7CB5F8"/>
    <path d="M150 38 A58 58 0 0 1 150 134 A70 70 0 0 0 150 38 Z" fill="#5E9CE8"/>
    <circle cx="152" cy="34" r="13" fill="#F9F8F3" stroke="#F7B951" stroke-width="7"/>
    <path class="sparkle" d="M178 12 L181 21 L190 24 L181 27 L178 36 L175 27 L166 24 L175 21 Z" fill="#F7B951" opacity="0"/>
    <g class="eyes">
      <ellipse cx="98" cy="84" rx="14" ry="16" fill="#FFFFFF"/>
      <ellipse cx="142" cy="84" rx="14" ry="16" fill="#FFFFFF"/>
      <circle cx="100" cy="88" r="7.5" fill="#2B2350"/>
      <circle cx="144" cy="88" r="7.5" fill="#2B2350"/>
      <circle cx="102.5" cy="85" r="2.5" fill="#FFFFFF"/>
      <circle cx="146.5" cy="85" r="2.5" fill="#FFFFFF"/>
    </g>
    <path d="M108 114 Q120 126 132 114" fill="none" stroke="#2B2350" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="80" cy="192" rx="11" ry="17" fill="#5E9CE8"/>
    <ellipse class="wave" cx="160" cy="192" rx="11" ry="17" fill="#5E9CE8"/>
  </g>
</svg>
