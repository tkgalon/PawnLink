name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Which model in gs://pawnlink-tkgalon-models/pawnlink-lgbm/ gets served.
  # Promoting a model = changing this line.
  MODEL_VERSION: "4"
  PROJECT_ID: pawnlink-tkgalon
  REGION: us-central1
  SERVICE: pawnlink-api
  SERVICE_URL: https://pawnlink-api-k6loc243yq-uc.a.run.app
  IMAGE: us-central1-docker.pkg.dev/pawnlink-tkgalon/pawnlink/api
  JOB: pawnlink-monthly
  JOB_IMAGE: us-central1-docker.pkg.dev/pawnlink-tkgalon/pawnlink/job

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"
          enable-cache: true

      # models/ is gitignored; this job builds with a dummy, deploy pulls the real one from GCS.
      - name: Create dummy model
        run: uv run --frozen --no-default-groups python scripts/make_dummy_model.py models

      - name: Build image
        run: docker build -t pawnlink:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 pawnlink:ci
          scripts/smoke_test.sh http://127.0.0.1:8080 dummy

      - name: Container logs
        if: failure()
        run: docker logs api

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets the job ask GitHub for the OIDC token that WIF checks
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1011340670287/locations/global/workloadIdentityPools/github/providers/pawnlink-repo
          service_account: github-deployer@pawnlink-tkgalon.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Download model
        run: |
          mkdir -p models
          gcloud storage cp "gs://pawnlink-tkgalon-models/pawnlink-lgbm/v$MODEL_VERSION/*" models/

      - name: Build and push images
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker build --build-arg UV_GROUPS="--group monitor" -t "$JOB_IMAGE:$GITHUB_SHA" .
          docker run --rm "$JOB_IMAGE:$GITHUB_SHA" python -c "import pawnlink.monitoring.monthly"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$JOB_IMAGE:$GITHUB_SHA"

      # max-instances=1 caps the bill even under a traffic spike; min-instances=0 means
      # nothing runs (or costs) while nobody is calling the API.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$GITHUB_SHA" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "pawnlink-api@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "PUBSUB_AUDIENCE=$SERVICE_URL/pubsub/predict,PUBSUB_PUSH_SA=pawnlink-pubsub@$PROJECT_ID.iam.gserviceaccount.com" \
            --labels "app=pawnlink,commit=$GITHUB_SHA"

      - name: Smoke test Cloud Run
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          scripts/smoke_test.sh "$url" "$MODEL_VERSION"

      # Only updates the job definition; Cloud Scheduler runs it on the 1st of each month.
      - name: Deploy monthly job
        run: |
          gcloud run jobs deploy "$JOB" \
            --image "$JOB_IMAGE:$GITHUB_SHA" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "pawnlink-job@$PROJECT_ID.iam.gserviceaccount.com" \
            --command python \
            --args="-m,pawnlink.monitoring.monthly" \
            --memory 2Gi \
            --cpu 1 \
            --task-timeout 30m \
            --max-retries 1 \
            --labels "app=pawnlink,commit=$GITHUB_SHA"
