description: Predictions served by pawnlink-api, by verdict and model version
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="pawnlink-api"
  AND jsonPayload.event="prediction"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  labels:
    - key: is_phishing
      valueType: STRING
    - key: model_version
      valueType: STRING
labelExtractors:
  is_phishing: EXTRACT(jsonPayload.is_phishing)
  model_version: EXTRACT(jsonPayload.model_version)
